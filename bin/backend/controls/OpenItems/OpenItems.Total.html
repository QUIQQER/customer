<div class="quiqqer-customer-openitems-totals-row">
    <div class="quiqqer-customer-openitems-totals-context">
        <p class="quiqqer-customer-openitems-totals-title">{{title}}</p>
        <div class="quiqqer-customer-openitems-totals-meta">
            {{#currency}}<span class="quiqqer-customer-openitems-totals-currency">{{currency}}</span>{{/currency}}
            <span>{{countLabel}}: {{count}}</span>
        </div>
    </div>
    <div class="quiqqer-customer-openitems-totals-values">
        <dl class="quiqqer-customer-openitems-totals-amounts">
            {{#metrics}}
            <div class="quiqqer-customer-openitems-totals-metric quiqqer-customer-openitems-totals-metric--{{type}}">
                <dt>{{label}}</dt>
                <dd>{{value}}</dd>
            </div>
            {{/metrics}}
        </dl>
        <dl class="quiqqer-customer-openitems-totals-settlement">
            {{#settlementMetrics}}
            <div class="quiqqer-customer-openitems-totals-metric quiqqer-customer-openitems-totals-metric--{{type}}">
                <dt>{{label}}</dt>
                <dd>{{value}}</dd>
            </div>
            {{/settlementMetrics}}
        </dl>
    </div>
</div>
